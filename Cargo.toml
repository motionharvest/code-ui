[package]
name = "code_ui"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Terminal split-pane harness for coding agents"
repository = "https://github.com/motionharvest/code-ui"
license = "MIT"

[[bin]]
name = "code-ui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ratatui = "0.26"
crossterm = "0.27"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "process", "signal", "term"] }
unicode-width = "0.2"
png = "0.17"
vt100 = { path = "vendor/vt100" }
